<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';">
<title>连接穹驭办公</title>
<style>
:root{
  --rail:#f7f7f8;
  --page:#ffffff;
  --ink:#111113;
  --ink-2:#52525b;
  --line:#e4e4e7;
  --line-strong:#d4d4d8;
  --accent:#18181b;
  --accent-hover:#27272a;
  --inverse:#ffffff;
  --hairline:#18181b;
  --danger:#dc2626;
  --radius:6px;
}
@media (prefers-color-scheme:dark){
  :root{
    --rail:#111113;
    --page:#0b0b0c;
    --ink:#f4f4f5;
    --ink-2:#a1a1aa;
    --line:#232328;
    --line-strong:#35353d;
    --accent:#fafafa;
    --accent-hover:#e4e4e7;
    --inverse:#09090b;
    --hairline:#ffffff;
    --danger:#f87171;
  }
}
*{box-sizing:border-box}
body{
  min-height:100vh;
  margin:0;
  padding:24px;
  display:grid;
  place-items:center;
  background:var(--rail);
  color:var(--ink);
  font:13.5px/1.6 "PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei","Noto Sans CJK SC","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.win-drag{position:fixed;inset:0 0 auto 0;height:44px;-webkit-app-region:drag;z-index:1}
main{
  position:relative;
  z-index:2;
  -webkit-app-region:no-drag;
  width:min(420px,100%);
  padding:32px 30px 28px;
  background:var(--page);
  border:1px solid var(--line);
  border-radius:8px;
}
main::before{
  content:"";
  position:absolute;
  left:24px;
  right:24px;
  top:-1px;
  height:1.5px;
  background:var(--hairline);
  transform-origin:left center;
  animation:draw 480ms cubic-bezier(.22,1,.36,1) both;
}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.brand-mark{
  display:grid;place-items:center;width:26px;height:26px;border-radius:var(--radius);
  background:var(--accent);color:var(--inverse);
}
.brand-mark svg{width:20px;height:20px}
.brand-mark .logo-outer{stroke-dasharray:42;stroke-dashoffset:42;animation:logo-draw 460ms cubic-bezier(.22,1,.36,1) 60ms forwards}
.brand-mark .logo-inner{stroke-dasharray:12;stroke-dashoffset:12;animation:logo-draw 280ms cubic-bezier(.22,1,.36,1) 240ms forwards}
.brand-mark .logo-axis{stroke-dasharray:12;stroke-dashoffset:12;animation:logo-draw 260ms cubic-bezier(.22,1,.36,1) 340ms forwards}
@keyframes logo-draw{to{stroke-dashoffset:0}}
.brand-name{font-size:14.5px;font-weight:680;color:var(--ink)}
h1{margin:0 0 6px;font-size:20px;font-weight:650;line-height:1.3;letter-spacing:-.02em}
p{margin:0;color:var(--ink-2);line-height:1.6;font-size:13px}
label{display:block;font-weight:580;font-size:12.5px;margin:20px 0 5px;color:var(--ink-2)}
input,button{width:100%;border-radius:var(--radius);font:inherit}
input{
  min-height:36px;
  padding:7px 10px;
  border:1px solid var(--line-strong);
  background:var(--page);
  color:var(--ink);
  transition:border-color 140ms ease,box-shadow 140ms ease;
}
input:focus{outline:none;border-color:var(--hairline);box-shadow:0 1px 0 0 var(--hairline)}
button{
  margin-top:12px;
  min-height:36px;
  padding:7px 12px;
  border:1px solid var(--accent);
  background:var(--accent);
  color:var(--inverse);
  font-weight:540;
  cursor:pointer;
  transition:background 140ms ease;
}
button:hover:not(:disabled){background:var(--accent-hover)}
button:disabled{opacity:.5;cursor:not-allowed}
.notice{min-height:20px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.notice.error{color:var(--danger)}
</style>
</head>
<body><div class="win-drag" aria-hidden="true"></div><main>
<div class="brand">
  <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="butt" stroke-linejoin="miter"><path class="logo-outer" d="M13 18H6V6h12v7" stroke-width="2"/><path class="logo-inner" d="M9.6 13.4V9.6h3.8" stroke-width="1.45"/><path class="logo-axis" d="M12.6 12.6L18.8 18.8" stroke-width="2"/></svg></span>
  <span class="brand-name">穹驭办公</span>
</div>
<h1>连接企业工作台</h1>
<p>输入公司提供的服务地址，连接后可登录并处理每日任务与办公会话。</p>
<form id="connection">
<label for="server">工作台服务地址</label><input id="server" type="url" value="https://office.aethernettech.dev" placeholder="https://office.example.com" required>
<button type="submit">连接工作台</button>
<p id="notice" class="notice" role="status"></p>
</form>
</main></body></html>
